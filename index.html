  <body class="bg-slate-950 text-slate-100 antialiased font-['Kantumruy_Pro',sans-serif] min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background-color:#020617;color:#f8fafc;font-family:'Kantumruy Pro',sans-serif;padding:24px;text-align:center;">
        <div>
          <div style="position:relative;width:76px;height:76px;margin:0 auto 20px;">
            <div style="position:absolute;inset:-3px;border-radius:50%;background:linear-gradient(135deg, #d97706, #fcd34d, #f59e0b);box-shadow:0 0 20px rgba(245,158,11,0.35);"></div>
            <img src="./channel_logo.jpg" alt="នាំដឹង - TO KNOW Logo" style="position:relative;width:76px;height:76px;border-radius:50%;object-fit:cover;display:block;border:2px solid #000c1c;" />
            <div style="position:absolute;inset:-7px;border:2px solid transparent;border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite;"></div>
          </div>
          <div style="font-size:17px;font-weight:700;letter-spacing:0.02em;margin-bottom:6px;color:#f8fafc;">នាំដឹង - TO KNOW</div>

        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
